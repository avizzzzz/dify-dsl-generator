app:
  mode: chat
  name: Chat Assistant
  description: ''
  icon: 🤖
  icon_background: '#1E64F0'
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  version: 0.1.0
  conversation_variables:
  - name: user_name
    type: string
    description: User's name
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: Hello! How can I help you today?
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - What is AI?
    - Tell me a joke
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      width: 244
      height: 54
      position:
        x: 80
        y: 162
      positionAbsolute:
        x: 80
        y: 162
      data:
        type: start
        title: 开始
        variables:
        - label: user_query
          variable: user_query
          required: true
          type: paragraph
          max_length: 5000
          options: []
        desc: ''
        selected: false
    - id: llm-1
      type: custom
      width: 244
      height: 98
      position:
        x: 380
        y: 162
      positionAbsolute:
        x: 380
        y: 162
      data:
        type: llm
        title: AI助手
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - id: 5c0c2370-b21e-5a18-ada5-68072e932c52
          role: system
          text: You are a helpful assistant. Answer concisely.
        - id: 84cc6569-8c03-527b-9e65-4a86a20f4dea
          role: user
          text: '{{#start.user_query#}}'
        context:
          enabled: false
          variable_selector: []
        memory:
          role_prefix:
            user: ''
            assistant: ''
          window:
            enabled: true
            size: 10
        desc: ''
        selected: false
    - id: answer-1
      type: custom
      width: 244
      height: 54
      position:
        x: 680
        y: 162
      positionAbsolute:
        x: 680
        y: 162
      data:
        type: answer
        title: 回答
        answer: '{{#llm-1.text#}}'
        desc: ''
        selected: false
    edges:
    - id: e-start-llm
      source: start
      target: llm-1
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: llm
    - id: e-llm-answer
      source: llm-1
      target: answer-1
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
