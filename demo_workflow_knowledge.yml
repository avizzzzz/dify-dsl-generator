app:
  mode: workflow
  name: Test
  description: ''
  icon: 🤖
  icon_background: '#1E64F0'
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  version: 0.1.0
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      width: 244
      height: 54
      position:
        x: 80
        y: 162
      positionAbsolute:
        x: 80
        y: 162
      data:
        type: start
        title: 开始
        variables:
        - label: query
          variable: query
          required: true
          type: text
          max_length: 2000
          options: []
        desc: ''
        selected: false
    - id: kret-1
      type: custom
      width: 244
      height: 54
      position:
        x: 380
        y: 162
      positionAbsolute:
        x: 380
        y: 162
      data:
        type: knowledge-retrieval
        title: 知识库检索
        dataset_ids:
        - dataset-uuid-001
        query_variable_selector:
        - start
        - query
        retrieval_mode: hybrid
        top_k: 5
        score_threshold: 0.6
        desc: ''
        selected: false
    - id: llm-1
      type: custom
      width: 244
      height: 98
      position:
        x: 680
        y: 162
      positionAbsolute:
        x: 680
        y: 162
      data:
        type: llm
        title: LLM总结
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - id: d37882d6-56df-58a8-a3ab-26bd84250631
          role: system
          text: Based on the retrieved knowledge, answer the query.
        - id: e874b1b2-08fa-55cc-b5b8-59a9cbb43ef8
          role: user
          text: 'Query: {{#start.query#}}

            Context: {{#kret-1.result#}}'
        context:
          enabled: false
          variable_selector: []
        memory:
          role_prefix:
            user: ''
            assistant: ''
          window:
            enabled: false
            size: 10
        desc: ''
        selected: false
    - id: end
      type: custom
      width: 244
      height: 54
      position:
        x: 980
        y: 162
      positionAbsolute:
        x: 980
        y: 162
      data:
        type: end
        title: 结束
        outputs:
        - value_selector:
          - llm-1
          - text
          variable: answer
        desc: ''
        selected: false
    edges:
    - id: e-s-kr
      source: start
      target: kret-1
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: knowledge-retrieval
    - id: e-kr-llm
      source: kret-1
      target: llm-1
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
    - id: e-llm-end
      source: llm-1
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
