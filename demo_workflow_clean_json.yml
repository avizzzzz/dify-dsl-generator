app:
  mode: workflow
  name: Test
  description: ''
  icon: 🤖
  icon_background: '#1E64F0'
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  version: 0.1.0
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      width: 244
      height: 54
      position:
        x: 80
        y: 162
      positionAbsolute:
        x: 80
        y: 162
      data:
        type: start
        title: 开始
        variables:
        - label: raw_json
          variable: raw_json
          required: true
          type: text
          max_length: 50000
          options: []
        desc: ''
        selected: false
    - id: code-clean
      type: custom
      width: 244
      height: 54
      position:
        x: 380
        y: 162
      positionAbsolute:
        x: 380
        y: 162
      data:
        type: code
        title: 清洗JSON提取文本
        code_language: python3
        code: "def main(raw_json: str) -> dict:\n    import json\n    data = json.loads(raw_json)\n\
          \    texts = [v for v in data.values() if isinstance(v, str) and len(v.strip())\
          \ > 10]\n    return {'text_array': texts}\n"
        variables:
        - variable: raw_json
          value_selector:
          - start
          - raw_json
        outputs:
          text_array:
            type: array[string]
            children: null
        desc: ''
        selected: false
    - id: iteration-refine
      type: custom
      width: 244
      height: 54
      position:
        x: 680
        y: 162
      positionAbsolute:
        x: 680
        y: 162
      data:
        type: iteration
        title: 迭代提炼AI干货
        isInIteration: false
        startNodeType: start
        start_node_id: start-iter
        iterator_selector:
        - code-clean
        - text_array
        output_selector:
        - llm-iter
        - text
        children:
          nodes:
          - id: start-iter
            type: custom
            width: 244
            height: 54
            position:
              x: 80
              y: 162
            positionAbsolute:
              x: 80
              y: 162
            data:
              type: start
              title: 开始
              variables:
              - label: item
                variable: item
                required: true
                type: text
                max_length: 10000
                options: []
              desc: ''
              selected: false
          - id: llm-iter
            type: custom
            width: 244
            height: 98
            position:
              x: 380
              y: 162
            positionAbsolute:
              x: 380
              y: 162
            data:
              type: llm
              title: LLM提炼干货
              model:
                provider: openai
                name: gpt-4o-mini
                mode: chat
                completion_params:
                  temperature: 0.7
              prompt_template:
              - id: 5c0c2370-b21e-5a18-ada5-68072e932c52
                role: system
                text: 提炼AI干货技巧，简洁概括。
              - id: 84cc6569-8c03-527b-9e65-4a86a20f4dea
                role: user
                text: '{{#start-iter.item#}}'
              context:
                enabled: false
                variable_selector: []
              memory:
                role_prefix:
                  user: ''
                  assistant: ''
                window:
                  enabled: false
                  size: 10
              desc: ''
              selected: false
          edges:
          - id: e-iter-1
            source: start-iter
            target: llm-iter
            sourceHandle: source
            targetHandle: target
            type: custom
            zIndex: 0
            data:
              isInIteration: true
              sourceType: start
              targetType: llm
        desc: ''
        selected: false
    - id: end
      type: custom
      width: 244
      height: 54
      position:
        x: 980
        y: 162
      positionAbsolute:
        x: 980
        y: 162
      data:
        type: end
        title: 结束
        outputs:
        - value_selector:
          - iteration-refine
          - output
          variable: final_result
        desc: ''
        selected: false
    edges:
    - id: e-start-code
      source: start
      target: code-clean
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: code
    - id: e-code-iter
      source: code-clean
      target: iteration-refine
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: code
        targetType: iteration
    - id: e-iter-end
      source: iteration-refine
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: iteration
        targetType: end
